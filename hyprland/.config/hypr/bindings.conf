# Application bindings
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime 

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

unbind = SUPER+ALT, SPACE
unbind = SUPER+CTRL, E
unbind = CTRL ALT, DELETE
unbind = SUPER+ALT, LEFT
unbind = SUPER+ALT, RIGHT
unbind = SUPER, SPACE
unbind = SUPER+CTRL, V
unbind = SUPER, P
unbind = SUPER, T
unbind = SUPER, S
unbind = SUPER, L
unbind = SUPER, K
unbind = SUPER, COMMA
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER+ALT+SHIFT, LEFT
unbind = SUPER+ALT+SHIFT, RIGHT

bind = SUPER+ALT, LEFT,  workspace, e-1
bind = SUPER+ALT, RIGHT, workspace, e+1

bind = SUPER, LEFT,  movewindow, l
bind = SUPER, RIGHT, movewindow, r

# Float and move windows with SUPER + ALT + left-drag; resize with right-drag
bind = SUPER ALT, mouse:272, setfloating
bindmd = SUPER ALT, mouse:272, Float and move window, movewindow
bindmd = SUPER ALT, mouse:273, Resize window, resizewindow

bind = SUPER+ALT+SHIFT, LEFT,  movetoworkspace, e-1
bind = SUPER+ALT+SHIFT, RIGHT, movetoworkspace, e+1

bindd = CTRL ALT, DELETE, Proccess Manager, exec, vicinae cmd launch @leonkohli/store.vicinae.process-manager:processes
bindd = SUPER+ALT, SPACE, Omarchy menu, exec, vicinae cmd launch @codingcodax/store.vicinae.omarchy-menu:index
bindd = SUPER+CTRL, E, Emoiji Picker, exec, vicinae cmd launch core:search-emojis
bindd = SUPER, P, Password menu, exec, vicinae cmd launch @fredrikmwold/store.vicinae.hyprland-monitors:configure-monitors
bindd = SUPER+CTRL, V, Clipboard menu, exec, vicinae cmd launch clipboard:history
bindd = SUPER, K, Hotkeys help, exec, vicinae cmd launch @tinkerbells/pass:pass
bindd = SUPER, R, Radix Tui, exec, vicinae cmd launch @FredrikMWold/radix:pipeline-jobs
bindd = SUPER, SPACE,Launcher, exec, vicinae toggle

bindd = SUPER, T, Floating teams, exec, omarchy-open-or-move-to-scratchpad ^teams-for-linux$ "uwsm-app -- /opt/teams-for-linux/teams-for-linux"
bindd = SUPER, S, Floating slack, exec, omarchy-open-or-move-to-scratchpad ^slack$ "uwsm-app -- slack"
bindd = SUPER, D, Floating discord, exec, omarchy-open-or-move-to-scratchpad ^discord$ "uwsm-app -- discord"
bindd = SUPER, RETURN, Terminal, exec, omarchy-open-or-move-to-scratchpad ^floating-terminal$  "uwsm-app -- kitty --class floating-terminal"
bindd = SUPER, L, Lock screen, exec, omarchy-system-lock
